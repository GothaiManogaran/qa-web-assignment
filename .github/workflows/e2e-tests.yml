name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: true
        type: choice
        default: sanity
        options:
          - sanity
          - All tests including a11y
          - a11y

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run sanity tests
        if: github.event.inputs.suite == 'sanity'
        run: npx playwright test --grep @sanity

      - name: Run a11y tests
        if: github.event.inputs.suite == 'a11y'
        run: npx playwright test login-accessibility

      - name: Run full suite (manual)
        if: github.event.inputs.suite == 'All tests including a11y'
        run: npx playwright test

      # Automatic push/PR runs skip @a11y - it documents 2 known, unfixed app
      # defects on purpose, which would otherwise turn every CI run red.
      # Run it explicitly via workflow_dispatch ('All tests including a11y' or 'a11y').
      - name: Run suite (push/PR, excludes a11y)
        if: github.event.inputs.suite == ''
        run: npx playwright test --grep-invert @a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
