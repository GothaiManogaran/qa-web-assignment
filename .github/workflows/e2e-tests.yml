name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: true
        type: choice
        default: sanity
        options:
          - sanity
          - full
          - a11y

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run sanity tests
        if: github.event.inputs.suite == 'sanity'
        run: npx playwright test --grep @sanity

      - name: Run a11y tests
        if: github.event.inputs.suite == 'a11y'
        run: npx playwright test login-accessibility

      # Excludes @a11y (whole category, run via 'a11y' option) and @known-issue
      # (the dropdown + responsive-spacing defects) - all document real,
      # unfixed app defects on purpose, which would otherwise turn every
      # automatic run red.
      - name: Run full suite (excludes a11y and other known issues)
        if: github.event.inputs.suite == 'full' || github.event.inputs.suite == ''
        run: npx playwright test --grep-invert "@a11y|@known-issue"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
