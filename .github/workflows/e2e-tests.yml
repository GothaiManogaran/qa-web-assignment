name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - full
          - accessibility

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        if: github.event.inputs.suite == 'smoke'
        run: npx playwright test --grep @smoke

      - name: Run accessibility tests
        if: github.event.inputs.suite == 'accessibility'
        run: npx playwright test login-accessibility

      - name: Run full suite (manual)
        if: github.event.inputs.suite == 'full'
        run: npx playwright test

      # Automatic push/PR runs skip @a11y - it documents 2 known, unfixed app
      # defects on purpose, which would otherwise turn every CI run red.
      # Run it explicitly via workflow_dispatch (full or accessibility).
      - name: Run suite (push/PR, excludes accessibility)
        if: github.event.inputs.suite == ''
        run: npx playwright test --grep-invert @a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
